name: DUJPP News Scraper

on:
  schedule:
    - cron: '0 6 * * *' # Zažene vsak dan ob 6:00 UTC
  workflow_dispatch: # Omogoča ročni zagon preko GitHub vmesnika

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Namestitev Python okolja
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Namestitev odvisnosti
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Zagon scraperja
        run: python ./scripts/dujppNewsScraper.py

      - name: Shranjevanje sprememb v repozitorij
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dujpp_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update DUJPP news JSON" && git push)
