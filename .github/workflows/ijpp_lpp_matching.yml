name: Update GTFS Mapping

on:
  schedule:
    - cron: "0 4 * * *" # Zažene se vsak dan ob 04:00 (UTC)
  workflow_dispatch: # Omogoča ročni zagon preko GitHub vmesnika

jobs:
  update-mapping:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Potrebno za potiskanje sprememb nazaj v repozitorij

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r ./scripts/requirements.txt

      - name: Run mapping script
        run: python ./scripts/generate_mapping.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add lpp_ijpp_mapping.json
          # Zgornji ukaz bo preskočen, če ni sprememb
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: lpp_ijpp_mapping.csv" && git push)
