name: Shrani GTFS JSON

on:
  # Sproži se ročno preko GitHub vmesnika
  workflow_dispatch: 
  # Lahko omogočiš tudi avtomatsko (npr. vsak dan ob 3:00 zjutraj)
   schedule:
     - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitorija
        uses: actions/checkout@v4

      - name: Priprava Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prenos in razširitev GTFS ZIP datoteke
        run: |
          mkdir -p gtfs
          # TUKAJ ZAMENJAJ URL S PRAVIM POVEZAVO DO GTFS ZIP-A:
          curl -L -o gtfs/data.zip "https://tvoj-vir.si/podatki/gtfs.zip"
          cd gtfs
          unzip data.zip
          # Pobrišemo zip, da ne dela gneče
          rm data.zip 

      - name: Poženi JS skripto
        run: node process_gtfs.js

      - name: Commit in Push ustvarjenega JSON-a
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stop_to_routes.json
          
          # Če je prišlo do sprememb, naredi commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Posodobitev stop_to_routes.json" && git push)
